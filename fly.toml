# E5 — Fly.io (§3, §6). Las claves van con `fly secrets set`, nunca aquí.
app = "e5-asistente-financiero"
primary_region = "mia"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # el webhook de Twilio no tolera cold starts largos
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
