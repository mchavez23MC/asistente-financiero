[project]
name = "e5-asistente-financiero"
version = "0.1.0"
description = "Asistente financiero conversacional sobre WhatsApp (E5). Arquitectura hexagonal."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "groq>=0.11",
    "supabase>=2.4",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
