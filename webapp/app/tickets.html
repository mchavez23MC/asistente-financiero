<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — Mis tickets</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="layout">
    <aside id="app-sidebar"></aside>
    <div class="content">
      <header id="app-topbar"></header>
      <main class="page page--narrow">
        <!-- Lista -->
        <section id="list-view">
          <div class="row-between mb-16"><h1 class="t-h1">Mis tickets</h1><button class="btn btn--outline btn--sm" id="new-ticket">Contactar</button></div>
          <div class="card card--pad0" style="padding:0 18px"><div id="tickets-list"></div></div>
        </section>

        <!-- Detalle -->
        <section id="detail-view" class="hide">
          <button class="btn btn--ghost btn--sm mb-16" id="back-btn">← Volver a mis tickets</button>
          <div id="ticket-detail"></div>
        </section>
      </main>
    </div>
  </div>
  <nav id="app-bottomnav"></nav>

  <!-- Modal contactar -->
  <div class="overlay" id="contact-overlay">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="row-between mb-8"><div class="modal__title" style="margin:0">Contactar al equipo</div><button class="iconbtn" data-close="contact-overlay" id="ctc"></button></div>
      <div class="banner banner--info mb-16 t-label"><span id="ct-ico"></span>Primero prueba con Luca — resuelve la mayoría al instante. <a href="chat.html">Ir al chat</a></div>
      <div class="field"><label class="field__label">Tema</label><select class="select"><option>Cargo que no reconozco</option><option>Problema con mi cuenta</option><option>Duda sobre un proceso</option><option>Otro</option></select></div>
      <div class="field"><label class="field__label">Describe tu caso</label><textarea class="textarea" placeholder="Cuéntanos qué pasó…"></textarea></div>
      <div class="modal__actions"><button class="btn btn--ghost" data-close="contact-overlay">Cancelar</button><button class="btn btn--primary" id="ct-send">Crear ticket</button></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script>
    LUCA.shell({ active: 'soporte', title: 'Mis tickets' });
    document.getElementById('ctc').innerHTML = LUCA.icon('x');
    document.getElementById('ct-ico').innerHTML = LUCA.icon('sparkles');
    var statusLabel = { new: 'Nuevo', open: 'Abierto', wip: 'En atención', done: 'Resuelto' };
    var priLabel = { high: 'Alta', mid: 'Media', med: 'Media', low: 'Baja' };
    LUCA.ready(function () {

    function renderList() {
      if (!LUCA.tickets.length) {
        document.getElementById('tickets-list').innerHTML = '<div class="empty"><div class="empty__art">🎧</div><div class="empty__title">No tienes tickets</div><div class="empty__text">Si Luca no puede con algo, aquí verás el seguimiento del equipo humano.</div></div>';
        return;
      }
      document.getElementById('tickets-list').innerHTML = LUCA.tickets.map(function (t) {
        return '<button class="lrow" data-t="' + t.id + '" style="width:100%;background:none;border:0;border-bottom:1px solid var(--luca-border);text-align:left">' +
          '<div class="lrow__main"><div class="row gap-8 mb-8"><span class="badge badge--' + t.status + '"><span class="badge__dot"></span>' + statusLabel[t.status] + '</span>' +
          '<span class="badge badge--' + t.priority + '"><span class="badge__dot"></span>' + priLabel[t.priority] + '</span></div>' +
          '<div class="lrow__title">#' + t.id + ' · ' + t.subject + '</div><div class="lrow__meta">' + t.ago + '</div></div>' + LUCA.icon('chevron-right', 'muted') + '</button>';
      }).join('');
      document.querySelectorAll('#tickets-list [data-t]').forEach(function (b) { b.addEventListener('click', function () { openDetail(b.dataset.t); }); });
    }

    function openDetail(id) {
      var t = LUCA.tickets.find(function (x) { return String(x.id) === String(id); }); if (!t) return;
      var bubbles = (t.transcript || []).map(function (m) {
        return '<div class="bubble bubble--' + (m.from === 'user' ? 'user' : 'bot') + '" style="font-size:14px">' + m.text + '</div>';
      }).join('');
      var replies = (t.replies || []).map(function (r) {
        return '<div class="card mb-8" style="background:var(--luca-navy-50);border:0"><div class="row-between mb-8"><span class="t-label">' + r.name + '</span><span class="muted t-micro">' + r.ago + '</span></div>' + r.text + '</div>';
      }).join('');
      document.getElementById('ticket-detail').innerHTML =
        '<div class="row gap-8 mb-16"><span class="badge badge--' + t.status + '"><span class="badge__dot"></span>' + statusLabel[t.status] + '</span>' +
        '<span class="badge badge--' + t.priority + '"><span class="badge__dot"></span>Prioridad ' + priLabel[t.priority] + '</span></div>' +
        '<h1 class="t-h1 mb-16">#' + t.id + ' · ' + t.subject + '</h1>' +
        '<div class="card mb-16"><div class="card__head"><span class="card__title">Contexto</span></div>' +
        '<p class="mb-8">' + t.summary + '</p><div class="muted t-label">' + t.reason + ' · ' + (LUCA.user.phone || '') + '</div></div>' +
        (bubbles ? '<div class="card mb-16"><div class="card__head"><span class="card__title">Conversación</span></div>' +
        '<div class="chat__scroll-inner" style="max-width:none;gap:8px">' + bubbles + '</div></div>' : '') +
        (replies ? '<div class="mb-16"><div class="t-label muted mb-8">Respuestas del equipo</div>' + replies + '</div>' : '') +
        (t.status === 'done' ? '<div class="card row-between" style="background:var(--luca-income-bg);border:0"><span class="t-label" style="color:var(--luca-income-text)">¿Quedó resuelto?</span><div class="row gap-8"><button class="iconbtn" id="tk-yes"></button><button class="iconbtn" id="tk-no"></button></div></div>' :
          '<div class="card"><label class="field__label">Añadir información</label><textarea class="textarea mb-8" placeholder="Escribe una respuesta…"></textarea><button class="btn btn--primary btn--sm" id="tk-reply">Enviar</button></div>');
      document.getElementById('list-view').classList.add('hide');
      document.getElementById('detail-view').classList.remove('hide');
      window.scrollTo(0, 0);
      var y = document.getElementById('tk-yes'); if (y) { y.innerHTML = LUCA.icon('thumbs-up'); y.addEventListener('click', function () { LUCA.toast('¡Nos alegra! Ticket cerrado'); }); }
      var no = document.getElementById('tk-no'); if (no) { no.innerHTML = LUCA.icon('thumbs-down'); no.addEventListener('click', function () { LUCA.toast('Reabrimos tu ticket', { type: 'info' }); }); }
      var rep = document.getElementById('tk-reply'); if (rep) rep.addEventListener('click', function () { LUCA.toast('Respuesta enviada'); });
    }
    document.getElementById('back-btn').addEventListener('click', function () { document.getElementById('detail-view').classList.add('hide'); document.getElementById('list-view').classList.remove('hide'); });

    document.getElementById('new-ticket').addEventListener('click', function () { LUCA.openModal('contact-overlay'); });
    // Contactar: el caso viaja por el MISMO pipeline (guardrail + agente): si es
    // sensible o el usuario pide humano, el sistema crea el ticket real.
    document.getElementById('ct-send').addEventListener('click', function () {
      var tema = document.querySelector('#contact-overlay select').value;
      var desc = document.querySelector('#contact-overlay textarea').value.trim();
      LUCA.closeModal('contact-overlay'); LUCA.toast('Enviando tu caso…');
      LUCA.sendChat('Necesito ayuda del equipo humano. Tema: ' + tema + '. ' + desc)
        .then(function () { LUCA.toast('Caso enviado ✅'); location.reload(); })
        .catch(function () { LUCA.toast('No pude enviarlo, intenta por el chat', { type: 'error' }); });
    });

    renderList();
    if (location.hash) { var id = location.hash.replace('#', ''); if (id) openDetail(id); }
    }); // LUCA.ready
  </script>
</body>
</html>
