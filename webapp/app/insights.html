<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — Insights y alertas</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="layout">
    <aside id="app-sidebar"></aside>
    <div class="content">
      <header id="app-topbar"></header>
      <main class="page page--narrow">
        <h1 class="t-h1 mb-8">Insights y alertas</h1>
        <p class="muted t-label mb-16">Luca revisa tus datos y te avisa antes. Todo con base en tus propios movimientos.</p>

        <div class="segmented mb-16" id="ins-filter">
          <button class="is-on" data-f="all">Todos</button>
          <button data-f="alert">Alertas</button>
          <button data-f="info">Sugerencias</button>
          <button data-f="done">Resueltos</button>
        </div>

        <div class="stack" id="ins-feed"></div>
      </main>
    </div>
  </div>
  <nav id="app-bottomnav"></nav>

  <!-- Modal detalle / acción -->
  <div class="overlay" id="ins-overlay">
    <div class="modal modal--lg" onclick="event.stopPropagation()">
      <div class="row-between mb-16"><div class="modal__title" style="margin:0" id="ins-title"></div><button class="iconbtn" data-close="ins-overlay" id="insc"></button></div>
      <div id="ins-detail"></div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script>
    LUCA.shell({ active: 'insights', title: 'Insights y alertas' });
    document.getElementById('insc').innerHTML = LUCA.icon('x');
    var insights = LUCA.insights.slice();
    var resolved = [];

    var typeMeta = {
      budget_warn: { ic: 'alert', label: 'Alerta de presupuesto' },
      duplicate: { ic: 'copy', label: 'Posible duplicado' },
      projection: { ic: 'chart', label: 'Proyección' },
      subscription: { ic: 'tv', label: 'Suscripción' },
      unusual: { ic: 'sparkles', label: 'Gasto inusual' }
    };

    function render(filter) {
      filter = filter || 'all';
      var list = insights.filter(function (i) {
        if (filter === 'all') return true;
        if (filter === 'done') return false;
        return i.severity === filter;
      });
      var feed = document.getElementById('ins-feed');
      if (filter === 'done') {
        feed.innerHTML = resolved.length ? resolved.map(card).join('') : emptyBlock('Nada resuelto aún', 'Cuando actúes sobre un aviso, aparecerá aquí.');
      } else {
        feed.innerHTML = list.length ? list.map(card).join('') : emptyBlock('Sin avisos', 'Luca no ha encontrado nada que reportar. ¡Bien ahí!');
      }
      bind();
    }
    function emptyBlock(t, s) { return '<div class="card empty"><div class="empty__art">✨</div><div class="empty__title">' + t + '</div><div class="empty__text">' + s + '</div></div>'; }

    function card(i) {
      var m = typeMeta[i.type], cat = LUCA.cat(i.cat);
      var col = i.severity === 'alert' ? 'var(--luca-alert-text)' : 'var(--luca-navy)';
      var bg = i.severity === 'alert' ? 'var(--luca-alert-bg)' : 'var(--luca-navy-50)';
      return '<div class="card" data-id="' + i.id + '">' +
        '<div class="row gap-8" style="align-items:flex-start">' +
        '<div class="cat-chip" style="background:' + bg + ';color:' + col + '">' + LUCA.icon(m.ic) + '</div>' +
        '<div style="flex:1">' +
        '<div class="row-between"><span class="t-h2" style="font-size:15px;font-weight:700">' + i.title + '</span><span class="muted t-micro">' + LUCA.relDate(i.date) + '</span></div>' +
        '<div class="mt-8">' + i.body + '</div>' +
        '<div class="muted t-micro mt-8">' + cat.emoji + ' ' + cat.name + ' · ' + i.evidence + '</div>' +
        '<div class="row gap-8 mt-12 wrap">' + actions(i) + '</div>' +
        '</div></div></div>';
    }
    function actions(i) {
      var a = '<button class="pill" data-act="detail" data-id="' + i.id + '">Ver detalle</button>';
      if (i.type === 'duplicate') a += '<button class="pill" data-act="dup" data-id="' + i.id + '">¿Ambos correctos?</button>';
      if (i.type === 'subscription') a += '<button class="pill" data-act="sub" data-id="' + i.id + '">Marcar recurrente</button>';
      if (i.type === 'budget_warn') a += '<a class="pill" href="presupuestos.html">Ver presupuesto</a>';
      a += '<button class="pill" data-act="ask" data-id="' + i.id + '">Pregúntale a Luca</button>';
      a += '<button class="pill" data-act="dismiss" data-id="' + i.id + '">Descartar</button>';
      return a;
    }
    function bind() {
      document.querySelectorAll('#ins-feed [data-act]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          var i = insights.find(function (x) { return x.id === b.dataset.id; });
          var act = b.dataset.act;
          if (act === 'detail') openDetail(i);
          else if (act === 'dup') openDup(i);
          else if (act === 'sub') { resolveInsight(i); LUCA.toast('Marcada como recurrente'); }
          else if (act === 'ask') location.href = 'chat.html';
          else if (act === 'dismiss') { resolveInsight(i); LUCA.toast('Aviso descartado'); }
        });
      });
    }
    function resolveInsight(i) { insights = insights.filter(function (x) { return x.id !== i.id; }); resolved.push(i); render(curFilter); }

    function openDetail(i) {
      var m = typeMeta[i.type], cat = LUCA.cat(i.cat);
      document.getElementById('ins-title').textContent = i.title;
      var chart = '';
      if (i.type === 'unusual') chart = LUCA.miniBars([{ label: 'Mediana', value: 22 }, { label: 'Este', value: 55 }]);
      else if (i.type === 'projection' || i.type === 'budget_warn') chart = LUCA.projection([0, 60, 130, 199], [280, 430], 200);
      else chart = LUCA.miniBars([{ label: 'May', value: 12.99 }, { label: 'Jun', value: 12.99 }, { label: 'Jul', value: 12.99 }]);
      document.getElementById('ins-detail').innerHTML =
        '<div class="badge badge--' + (i.severity === 'alert' ? 'high' : 'low') + ' mb-16"><span class="badge__dot"></span>' + m.label + '</div>' +
        '<p class="mb-16">' + i.body + '</p>' +
        '<div class="card mb-16" style="background:var(--luca-bg-2)"><div class="t-label muted mb-8">Por qué te lo digo</div>' + i.evidence + '</div>' +
        '<div class="card mb-16">' + chart + '</div>' +
        '<div class="row gap-8 wrap">' +
        (i.type === 'budget_warn' || i.type === 'unusual' ? '<a class="btn btn--outline btn--sm" href="presupuestos.html">Crear/ver presupuesto</a>' : '') +
        '<a class="btn btn--outline btn--sm" href="movimientos.html">Ver movimientos</a>' +
        '<a class="btn btn--primary btn--sm" href="chat.html">Pregúntale a Luca</a></div>';
      LUCA.openModal('ins-overlay');
    }
    function openDup(i) {
      document.getElementById('ins-title').textContent = 'Posible cargo duplicado';
      document.getElementById('ins-detail').innerHTML =
        '<p class="mb-16">Encontré dos cargos de <strong>$18.50</strong> en KFC con 11 minutos de diferencia. No afirmo que sea un error — ¿ambos son correctos?</p>' +
        '<div class="stack mb-16">' +
        '<div class="tx-row" style="border:1px solid var(--luca-border);border-radius:10px;padding:10px"><div class="cat-chip">🍔</div><div class="tx-row__main"><div class="tx-row__title">KFC</div><div class="tx-row__meta">Hoy · 13:20 · Débito</div></div><div class="tx-row__amt">−$18.50</div></div>' +
        '<div class="tx-row" style="border:1px solid var(--luca-border);border-radius:10px;padding:10px"><div class="cat-chip">🍔</div><div class="tx-row__main"><div class="tx-row__title">KFC</div><div class="tx-row__meta">Hoy · 13:31 · Débito</div></div><div class="tx-row__amt">−$18.50</div></div>' +
        '</div>' +
        '<div class="modal__actions"><button class="btn btn--outline" id="dup-both">Sí, ambos correctos</button><button class="btn btn--danger" id="dup-del">Eliminar uno</button></div>';
      LUCA.openModal('ins-overlay');
      document.getElementById('dup-both').addEventListener('click', function () { LUCA.closeModal('ins-overlay'); resolveInsight(i); LUCA.toast('Perfecto, los dejo tal cual'); });
      document.getElementById('dup-del').addEventListener('click', function () { LUCA.closeModal('ins-overlay'); resolveInsight(i); LUCA.toast('Cargo duplicado eliminado'); });
    }

    var curFilter = 'all';
    document.getElementById('ins-filter').addEventListener('click', function (e) {
      var b = e.target.closest('[data-f]'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.remove('is-on'); }); b.classList.add('is-on');
      curFilter = b.dataset.f; render(curFilter);
    });
    render('all');
  </script>
</body>
</html>
