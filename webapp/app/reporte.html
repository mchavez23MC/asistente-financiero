<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — Reporte mensual</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="layout">
    <aside id="app-sidebar"></aside>
    <div class="content">
      <header id="app-topbar"></header>
      <main class="page">
        <div class="row-between mb-16">
          <div class="row gap-8">
            <button class="iconbtn" id="prev-m" aria-label="Mes anterior"></button>
            <h1 class="t-h1" id="month-title">Julio 2026</h1>
            <button class="iconbtn" id="next-m" aria-label="Mes siguiente"></button>
          </div>
          <button class="btn btn--outline btn--sm" id="export" >Exportar</button>
        </div>

        <div class="grid grid-3 mb-16">
          <div class="card"><div class="metric__label">Ingresos</div><div class="metric__value income">$1,300.00</div><div class="delta income mt-8" id="d1"></div></div>
          <div class="card"><div class="metric__label">Gastos</div><div class="metric__value">$916.03</div><div class="delta alert-c mt-8" id="d2"></div></div>
          <div class="card"><div class="metric__label">Flujo neto</div><div class="metric__value">$383.97</div><div class="delta income mt-8" id="d3"></div></div>
        </div>

        <div class="grid grid-dash">
          <div class="stack">
            <div class="card"><div class="card__head"><span class="card__title">Ingresos vs gastos</span></div><div id="cf"></div></div>
            <div class="card"><div class="card__head"><span class="card__title">Top comercios</span></div><div id="merchants"></div></div>
          </div>
          <div class="card"><div class="card__head"><span class="card__title">Gasto por categoría</span></div><div class="center mb-16" id="donut"></div><div class="legend" id="legend"></div></div>
        </div>
      </main>
    </div>
  </div>
  <nav id="app-bottomnav"></nav>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script>
    LUCA.shell({ active: 'inicio', title: 'Reporte mensual' });
    document.getElementById('prev-m').innerHTML = LUCA.icon('chevron-left');
    document.getElementById('next-m').innerHTML = LUCA.icon('chevron-right');
    document.getElementById('export').innerHTML = LUCA.icon('download') + 'Exportar';
    document.getElementById('d1').innerHTML = LUCA.icon('arrow-up') + '+7% vs junio';
    document.getElementById('d2').innerHTML = LUCA.icon('arrow-down') + '−9% vs junio';
    document.getElementById('d3').innerHTML = LUCA.icon('arrow-up') + '+87% vs junio';
    document.getElementById('cf').innerHTML = LUCA.cashflow(LUCA.cashflow6m);
    var bd = LUCA.categoryBreakdown.map(function (c) { return { label: LUCA.cat(c.code).name, value: c.amount, color: c.color }; });
    document.getElementById('donut').innerHTML = LUCA.donut(bd, { centerLabel: 'Gastado', size: 170 });
    var total = bd.reduce(function (a, c) { return a + c.value; }, 0);
    document.getElementById('legend').innerHTML = LUCA.categoryBreakdown.map(function (c) { var cat = LUCA.cat(c.code); return '<div class="legend__item"><span class="legend__dot" style="background:' + c.color + '"></span><span class="legend__name">' + cat.emoji + ' ' + cat.name + '</span><span class="legend__val luca-amount">' + LUCA.fmt(c.amount) + '</span><span class="legend__pct">' + Math.round(c.amount / total * 100) + '%</span></div>'; }).join('');
    document.getElementById('merchants').innerHTML = [['🏠 Arriendo', 320], ['🍔 KFC', 37], ['🛒 Supermaxi', 62.40], ['💊 Fybeca', 55], ['📱 Netlife', 39.90]].map(function (m) { return '<div class="lrow"><div class="lrow__main"><div class="lrow__title">' + m[0] + '</div></div><span class="luca-amount">' + LUCA.fmt(m[1]) + '</span></div>'; }).join('');
    document.getElementById('export').addEventListener('click', function () { LUCA.toast('Preparando tu reporte…'); });
    document.getElementById('prev-m').addEventListener('click', function () { LUCA.toast('Mes anterior (demo)', { type: 'info' }); });
    document.getElementById('next-m').addEventListener('click', function () { LUCA.toast('Mes siguiente (demo)', { type: 'info' }); });
  </script>
</body>
</html>
